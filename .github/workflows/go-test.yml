name: Go Test

on:
  push:
    branches:
      - dev
      - main
      - master
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -v -coverprofile=coverage_temp.out  -covermode=atomic ./...

      - name: Remove mocks and examples from coverage
        run: grep -v -e "/zeroconf/mocks/" -e "/zeroconf/examples/" coverage_temp.out > coverage.out

      - name: Send coverage
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.out

      - name: Run Gosec Security Scanner
        uses: securego/gosec@v2.23.0
        with:
          # we let the report trigger content trigger a failure using the GitHub Security features.
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        with:
          # Path to SARIF file relative to the root of the repository
          sarif_file: results.sarif
